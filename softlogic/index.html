<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account deletion Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }

        .header {
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .form-wrapper {
            padding: 0;
        }

        iframe {
            width: 100%;
            height: 900px;
            border: none;
        }

        @media (max-width: 768px) {
            .header {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            iframe {
                height: 1000px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <div class="header">
            <h1>Accont deletion request form</h1>
            <p>Please complete the form below.</p>
        </div>

        <div class="form-wrapper">
            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSeejxNIHFqURsBlZmHORAwoRU--J_S2YioEM4poibuNkgP5Qg/viewform?embedded=true"
                loading="lazy">
            </iframe>
        </div>

    </div>
</div>

</body>
</html>
